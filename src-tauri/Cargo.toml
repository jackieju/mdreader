[package]
name = "mdreader"
version = "0.1.0"
edition = "2021"
description = "MD Reader — Tauri v2 markdown viewer with terminal-match theme"
authors = ["mdreader"]

[[bin]]
name = "mdreader"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
